; PlatformIO build (verified) - Arduino IDE users can ignore this file.
;   pip install platformio
;   pio run                     (build)
;   pio run -t upload           (SerialUPDI: set upload_port to your COM port)
[platformio]
src_dir = .

[env:t1616]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino
board_build.f_cpu = 20000000L
; TWI_TIMEOUT_ENABLE: without it megaTinyCore's Wire waits FOREVER when the
; bus stalls mid-transaction (noise-glitched IS31 stretching the clock) —
; tens-of-ms silent stalls showed up as effect stutter, and a hard wedge only
; ended at the 2 s watchdog. With the timeout a stall is bounded to a few ms,
; reported as an error, and the chunk retry / recovery paths take over.
build_flags = -flto -DTWI_TIMEOUT_ENABLE
build_unflags = -fno-lto
upload_protocol = serialupdi
; upload_port = COM3
upload_speed = 230400
